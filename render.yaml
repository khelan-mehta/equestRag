services:
  - type: web
    name: equest-backend
    env: python
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --worker-tmp-dir /dev/shm --timeout 120

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.8
      - key: CORS_ORIGINS
        value: https://your-frontend.onrender.com,http://localhost:5173
      - key: FLASK_DEBUG
        value: "false"

    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: equest-frontend
    env: static
    plan: free

    buildCommand: |
      cd frontend && npm install && npm run build

    staticPublishPath: ./frontend/dist

    envVars:
      - key: VITE_API_URL
        value: https://equest-backend.onrender.com/api

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
